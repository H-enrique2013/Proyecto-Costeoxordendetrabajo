<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Órdenes de Trabajo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        .action-btn {
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .action-btn:hover {
            transform: scale(1.1);
        }

        .card-task {
            box-shadow: 0 0 10px rgba(0,0,0,0.05);
            border: none;
        }

        .card-task .card-header {
            font-weight: bold;
            background-color: #f8f9fa;
        }

        .navbar-brand {
            font-size: 1.3rem;
        }
    </style>
</head>
<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary py-3">
        <div class="container">
            <a class="navbar-brand" href="#">MIS ÓRDENES DE TRABAJO</a>
            <div class="ms-auto text-white">
                Bienvenido/a {{session['name']}} {{session['surnames']}} |
                <a href="{{url_for('logout')}}" class="text-white text-decoration-underline ms-2">Salir</a>
            </div>
        </div>
    </nav>

    <!-- Iconos de acción -->
    <div class="container my-4 text-center">
        <div class="d-inline-block me-3">
            <img src="{{url_for('static', filename='images/plus-circle-solid.svg')}}" width="30" class="action-btn" data-bs-toggle="modal" data-bs-target="#task-modal" title="Nueva Tarea">
        </div>
        <div class="d-inline-block">
            <img src="{{url_for('static', filename='images/user-plus-solid.svg')}}" width="30" class="action-btn" data-bs-toggle="modal" data-bs-target="#user-modal" title="Nuevo Usuario">
        </div>
    </div>

    <!-- Lista de Tareas -->
    <div class="container">
        <div class="row row-cols-1 row-cols-md-3 row-cols-lg-4 g-4">
            {% for task in tasks %}
            <div class="col">
                <div class="card card-task h-100">
                    <div class="card-header">
                        {{task.title}}
                    </div>
                    <div class="card-body">
                        <p class="card-text">{{task.description}}</p>
                    </div>
                    <div class="card-footer d-flex justify-content-between align-items-center">
                        <small class="text-muted">{{task.date_task}}</small>
                        <form action="/delete-task" method="POST" class="mb-0">
                            <input type="hidden" name="id" value="{{task.id}}">
                            <button type="submit" class="btn btn-sm btn-outline-danger">Eliminar</button>
                        </form>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>

    <!-- MODAL: Nueva Tarea -->
    <div class="modal fade" id="task-modal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <form action="/new-task" method="post">
                    <div class="modal-header bg-primary text-white">
                        <h5 class="modal-title">Nueva Tarea</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                    </div>
                    <div class="modal-body">
                        <label class="form-label">Título</label>
                        <input type="text" class="form-control mb-3" name="title" required>

                        <label class="form-label">Descripción</label>
                        <textarea class="form-control mb-3" name="description" rows="4" required></textarea>
                    </div>
                    <div class="modal-footer">
                        <button type="submit" class="btn btn-success w-100">Guardar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- MODAL: Nuevo Usuario -->
    <div class="modal fade" id="user-modal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <form action="/new-user" method="post">
                    <div class="modal-header bg-primary text-white">
                        <h5 class="modal-title">Nuevo Usuario</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                    </div>
                    <div class="modal-body">
                        <div class="row">
                            <div class="col-6">
                                <label class="form-label">Nombre</label>
                                <input type="text" class="form-control mb-3" name="name" required>
                            </div>
                            <div class="col-6">
                                <label class="form-label">Apellidos</label>
                                <input type="text" class="form-control mb-3" name="surnames" required>
                            </div>
                        </div>
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control mb-3" name="email" required>

                        <label class="form-label">Contraseña</label>
                        <input type="password" class="form-control mb-3" name="password" required>
                    </div>
                    <div class="modal-footer">
                        <button type="submit" class="btn btn-success w-100">Guardar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

</body>
</html>
