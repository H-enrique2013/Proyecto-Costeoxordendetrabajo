<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DANNA PERÚ | Sistema de Órdenes de Trabajo</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(to right, #e0eafc, #cfdef3);
    }

    .login-card {
      width: 100%;
      max-width: 600px;
      border: none;
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
      background-color: #ffffff;
    }

    .brand-title {
      font-weight: 600;
      color: #0d6efd;
    }

    .form-label {
      font-weight: 500;
    }

    .login-header {
      border-bottom: 1px solid #dee2e6;
      margin-bottom: 1rem;
      padding-bottom: 0.5rem;
    }

    .btn-primary {
      background-color: #0d6efd;
      border: none;
      font-weight: 500;
    }

    .btn-primary:hover {
      background-color: #084cdf;
    }

    .input-group-text {
      background-color: #ffffff;
      border-left: none;
      cursor: pointer;
    }

    .form-control:focus {
      box-shadow: none;
    }

    .input-group .form-control {
      border-right: none;
    }

    .alert {
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

<main class="d-flex justify-content-center align-items-center min-vh-100 px-3">
  <div class="login-card p-4">
    <div class="text-center login-header">
      <h4 class="brand-title">DANNA PERÚ</h4>
      <p class="text-muted mb-0">Sistema de Órdenes de Trabajo</p>
    </div>

    <form action="/login" method="post">
      <div class="mb-3">
        <label for="email" class="form-label">Correo electrónico</label>
        <input type="email" class="form-control" name="email" id="email" required>
      </div>

      <div class="mb-3">
        <label for="password" class="form-label">Contraseña</label>
        <div class="input-group">
          <input type="password" class="form-control" name="password" id="password" required>
          <span class="input-group-text" id="togglePassword">
            <i class="bi bi-eye-fill" id="icon-eye"></i>
          </span>
        </div>
      </div>

      {% if message %}
      <div class="alert alert-danger alert-dismissible fade show" role="alert">
        <strong>Error:</strong> {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
      </div>
      {% endif %}

      <div class="d-grid">
        <button type="submit" class="btn btn-primary">Acceder</button>
      </div>
    </form>
  </div>
</main>

<script>
  const toggle = document.getElementById('togglePassword');
  const password = document.getElementById('password');
  const iconEye = document.getElementById('icon-eye');

  toggle.addEventListener('click', () => {
    const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
    password.setAttribute('type', type);
    iconEye.classList.toggle('bi-eye-fill');
    iconEye.classList.toggle('bi-eye-slash-fill');
  });
</script>

</body>
</html>
